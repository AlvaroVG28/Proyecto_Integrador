<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DASHBOARD</title>
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/colors.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>

  <!-- ======================================
       PÁGINA: DASHBOARD
       Descripción: resumen general del sistema.
       ====================================== -->
  <body class="dashboard">
    <!-- SIDEBAR / MENÚ LATERAL -->
    <header class="dashboard-header">
      <h1>Sistema de Gestión de Recursos</h1>
      <nav class="dashboard-nav">
        <ul class="dashboard-menu">
          <li><a href="DASHBOARD.html">Inicio</a></li>
          <li><a href="CURSOS.html">Cursos</a></li>
          <li><a href="ESTUDIANTES.html">Estudiantes</a></li>
          <li><a href="MATRICULA.html">Matrícula</a></li>
        </ul>
      </nav>

      <footer class="dashboard-footer-sydebar">
        <p>Alvaro Vera</p>
        <p>alvera@cesde.net</p>
      </footer>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="dashboard-main">
      <!-- BARRA SUPERIOR -->
      <header class="dashboard-topbar">
        <h2>Sistema de Gestión de Cursos</h2>
      </header>

      <!-- SECCIÓN DE CONTENIDO DEL DASHBOARD -->
      <section class="dashboard-content">
        <!-- ENCABEZADO DE LA PÁGINA -->
        <header class="dashboard-content-header">
          <hgroup>
            <h1>Dashboard</h1>
            <p>Resumen general del sistema</p>
          </hgroup>
        </header>
      </section>

      <!-- AQUÍ IRÁN LAS TARJETAS DEL DASHBOARD -->
      <div class="dashboard-cards">
        <div class="card">
          <h2 class="color1">Estudiantes</h2>
          <p>3</p>
        </div>
        <div class="card">
          <h2 class="color2">Cursos</h2>
          <p>2</p>
        </div>
        <div class="card">
          <h2 class="color3">Matrículas</h2>
          <p>4</p>
        </div>
      </div>

      <section
        class="dashboard-images"
        aria-label="Recursos visuales del sistema"
      >
        <figure class="dashboard-image-card">
          <img
            src="../img/matriculas_estado.png"
            alt="Estudiantes reunidos trabajando en equipo"
          />
        </figure>
        <figure class="dashboard-image-card">
          <img
            src="../img/cursos_populares.png"
            alt="Libros y materiales de estudio sobre una mesa"
          />
        </figure>
      </section>

      <footer class="dashboard-footer-main">
        <p>©2026 Sistema de Gestión de Cursos</p>
      </footer>
    </main>
  </body>
</html>
